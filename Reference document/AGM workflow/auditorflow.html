<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AGM Modal Equal Boxes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .modal-content {
      border-radius: 8px;
      overflow: hidden;
    }

    .agm-row {
      display: flex;
      height: 260px; /* fixed height for modal body */
      margin: 0;
    }

    .agm-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 20px;
      border: 1px solid #dee2e6;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      user-select: none;
    }

    .agm-col:not(:last-child) {
      border-right: none; /* We'll use box-shadow to separate */
      box-shadow: inset -1px 0 0 0 #dee2e6;
    }

    .agm-col:hover {
      box-shadow: 0 0 15px rgba(0,0,0,0.12);
      transform: scale(1.02);
      background-color: #fff;
      z-index: 2;
    }

    .agm-left {
      background-color: #fef2f2;
      color: #a71d2a;
    }

    .agm-right {
      background-color: #ecfdf5;
      color: #237a3e;
    }

    .agm-col h6 {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .agm-col p {
      font-size: 1rem;
      color: #444;
      margin-bottom: 0;
      max-width: 260px;
    }

    .spinner-box {
      display: none;
      margin-top: 15px;
      text-align: center;
      font-size: 0.9rem;
    }

    .spinner-border {
      width: 1.3rem;
      height: 1.3rem;
    }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #dee2e6;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-dialog {
      max-width: 600px;
    }

    .modal-body {
      padding: 0;
    }
  </style>
</head>
<body>

<div class="text-center mt-5">
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#agmModal">
    Click here to show popup
  </button>
</div>

<!-- Modal -->
<div class="modal fade" id="agmModal" tabindex="-1" aria-labelledby="agmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Annual General Meeting: Choose Audit Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <div class="agm-row">
          <!-- NOT Exempt Section -->
          <div
            class="agm-col agm-left text-center"
            onclick="startRedirect('not', 'agm_create.html')"
            role="button"
            tabindex="0"
            onkeypress="if(event.key==='Enter'){startRedirect('not', 'agm_create.html')}"
          >
            <h6>🔴 NOT Exempt from Audit</h6>
            <p>Company is <strong>NOT</strong> exempt from audit requirements.</p>
            <div id="spinner-not" class="spinner-box">
              <div class="spinner-border text-danger" role="status" aria-hidden="true"></div>
              <div>Processing...</div>
            </div>
          </div>

          <!-- Exempt Section -->
          <div
            class="agm-col agm-right text-center"
            onclick="startRedirect('exempt', 'agm_exempt_action.html')"
            role="button"
            tabindex="0"
            onkeypress="if(event.key==='Enter'){startRedirect('exempt', 'agm_exempt_action.html')}"
          >
            <h6>🟢 Exempt from Audit</h6>
            <p>Company <strong>IS</strong> exempt from audit requirements.</p>
            <div id="spinner-exempt" class="spinner-box">
              <div class="spinner-border text-success" role="status" aria-hidden="true"></div>
              <div>Processing...</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function startRedirect(type, url) {
    // Disable all clicks during processing
    document.querySelectorAll('.agm-col').forEach(el => el.style.pointerEvents = 'none');

    // Show spinner for selected
    document.getElementById('spinner-' + type).style.display = 'block';

    setTimeout(() => {
      window.location.href = url;
    }, 5000);
  }
</script>

</body>
</html>
